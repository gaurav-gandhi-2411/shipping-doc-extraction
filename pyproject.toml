[project]
name = "shipdoc-extract"
version = "0.1.0"
description = "Structured extraction from shipping-document images (invoices, air waybills)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pycountry>=26.2.16",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipdoc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
ocr = [
    "langchain==0.3.30",
    "langchain-community==0.3.31",
    "langchain-core==0.3.86",
    "langchain-openai==0.3.35",
    "langchain-text-splitters==0.3.11",
    "paddleocr==3.0.3",
    "paddlepaddle==3.0.0",
    "paddlex==3.0.3",
    "setuptools>=84.0.0",
    "stringzilla<5.1",
]
# VLM stack for Colab T4 / Linux GPU boxes; install with: uv sync --group vlm (not the local default).
vlm = [
    "torch>=2.5",
    "torchvision",  # Qwen3.5 card: the image processor needs torchvision
    "transformers==5.18.0",
    "accelerate>=1.1.0",
    "bitsandbytes==0.50.2",
    "xgrammar==0.2.8",
    "wandb",
]
# LoRA fine-tune (shipdoc.train); install on Colab with: uv sync --frozen --group vlm --group train.
train = [
    "peft==0.21.2",
]
# Native Windows CUDA (RTX 3070, 8 GB) debug stack; install with: uv sync --group gpu-local.
# Conflicts with vlm because torch comes from the PyTorch cu126 index here (+cu126 local
# version) and from PyPI for vlm (Linux/Colab). Debug only, never a reporting environment.
gpu-local = [
    "torch==2.14.1",
    "torchvision",
    "transformers==5.18.0",
    "accelerate>=1.1.0",
    "bitsandbytes==0.50.2",
    "xgrammar==0.2.8",
]

[tool.uv]
conflicts = [[{ group = "vlm" }, { group = "gpu-local" }]]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", group = "gpu-local" }
torchvision = { index = "pytorch-cu126", group = "gpu-local" }
