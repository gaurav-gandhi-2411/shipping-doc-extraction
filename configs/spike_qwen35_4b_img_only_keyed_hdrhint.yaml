# PRODUCTION config (spike_qwen35_4b_img_only.yaml: keyed json, prompt v2) plus ONE opt-in flag,
# header_hint. For page >= 2 of a multi-page document the page-1 table header row (OCR text from
# the cached PaddleOCR output) is appended to the prompt as "Column headers from page 1: ..."
# (src/shipdoc/headerhint.py). Everything else is identical, so the A/B (notebook 07_hdrhint_ab)
# isolates the hint. DEPLOYMENT COST: the hint needs OCR text of page 1 at inference time (a
# Paddle pass, like R2); with no OCR the hint is absent and the prompt is the production prompt.
# Run with SHIPDOC_OCR_CACHE pointing at the OCR cache:
#   python -m shipdoc spike --config configs/spike_qwen35_4b_img_only_keyed_hdrhint.yaml \
#       --docs <doc list> --split train+dev --run-id <id> --logprobs
# Qwen3.5-4B, native Qwen3_5ForConditionalGeneration (transformers >= 5.2). fp16: the T4
# has no bf16. Thinking is forced off by the adapter (enable_thinking=False); the repo
# ships no generation_config, so every generation arg is passed explicitly.
name: qwen35_4b_img_only_keyed_hdrhint
arm: img_only  # img_only | img_ocr (reading-order PaddleOCR text as a hint)
model:
  key: qwen35_4b
  repo: Qwen/Qwen3.5-4B
  revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a  # pinned commit
  adapter: qwen35
  dtype: float16
  quant: none  # none | nf4
  attn_implementation: null
  trust_remote_code: false
# Visual-token cap: patch 16 x merge 2 = 32 px per token, so tokens = pixels / 32^2.
# 1280*32*32 -> 1,260 tokens for a 1240x1754 page. The processor default (no cap) is 2,145
# tokens for that page; 1024*32*32 would give 988. Tune on the spike (spec Phase 2.4).
max_pixels: 1310720
# max_new_tokens = roundup64(ceil(p99_page_tokens * 1.25)); p99 of the gold per-page target
# length of the 400 train docs (current json format) with this model's tokenizer: 1190 -> 1488
# -> 1536 (Qwen3-VL: 1191; the 4B reuses the 8B tokenizer, unchecked). Max observed 1244/1246,
# so the old cap of 1536 was NOT below the observed max. reports/token_budget.md (UNVERIFIED).
# Hitting the cap means a truncated (invalid) page.
max_new_tokens: 1536
output_format: json  # json | compact (short keys, positional row arrays; reports/output_format.md)
ocr_token_budget: 1200  # img_ocr only: OCR hint truncated line-wise, counted with the model tokenizer
prompt_version: v2  # must equal shipdoc.prompts.PROMPT_VERSION
seed: 42
header_hint: true  # opt-in, default off: page-1 header row OCR text on page >= 2 (img_only)
